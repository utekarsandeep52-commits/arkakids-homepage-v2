  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

ef=\"https://arkakids.com/kindergarten.html\" style=\"{{ navSubLinkStyle }}\" style-hover=\"background: #F1E6D8; color: #2B2320;\">Kindergarten<\u002Fa>\n          <a href=\"https://arkakids.com/montessori-teachers-training.html\" style=\"{{ navSubLinkStyle }}\" style-hover=\"background: #F1E6D8; color: #2B2320;\">Montessori Teachers' Training<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <a href=\"https://arkakids.com/gallery.html\" style=\"{{ navLinkStyle }}\" style-hover=\"color: #B2461F;\">Gallery<\u002Fa>\n      <a href=\"https://arkakids.com/franchise.html\" style=\"{{ navLinkStyle }}\" style-hover=\"color: #B2461F;\">Franchise<\u002Fa>\n      <a href=\"#enquire\" style=\"{{ navLinkStyle }}\" style-hover=\"color: #B2461F;\">Contact Us<\u002Fa>\n      <a href=\"#enquire\" style=\"display: inline-flex; align-items: center; height: 44px; padding: 0 22px; border-radius: 999px; background: #B2461F; color: #FBF6EE; font-weight: 600; white-space: nowrap; transition: transform .15s cubic-bezier(.2,0,0,1), background .15s ease, border-color .15s ease, color .15s ease, box-shadow .15s ease;\" style-hover=\"background: #8E3617; color: #FBF6EE; transform: translateY(-2px);\" style-active=\"transform: scale(.97);\">Book a visit<\u002Fa>\n    <\u002Fnav>\n  <\u002Fheader>\n\n  <section id=\"top\" style=\"padding: clamp(20px, 4vw, 56px) 0 clamp(28px, 4vw, 56px); display: flex; flex-wrap: wrap; gap: clamp(22px, 4vw, 72px); align-items: center;\">\n    <div style=\"flex: 1.05 1 440px; min-width: min(100%, 300px);\">\n      <p class=\"ak-rise\" style=\"font-family: 'Gabarito', sans-serif; font-size: 14px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; color: #B2461F; margin-bottom: clamp(16px, 2vw, 24px);\">Arka Kids International School<\u002Fp>\n      <h1 class=\"ak-rise\" style=\"{{ heroTitleStyle }}\">A <span style=\"display: inline-grid; vertical-align: bottom; overflow: hidden;\">{{ heroWord }}<\u002Fspan> first classroom for young learners.<\u002Fh1>\n      <p class=\"ak-rise\" style=\"{{ heroSubStyle }}\">Montessori-led preschool for ages 1.5 to 6, plus certified teacher training, across South India.<\u002Fp>\n      <div class=\"ak-rise\" style=\"{{ heroCtaRowStyle }}\">\n        <a href=\"#enquire\" style=\"{{ heroCtaPrimary }}\" style-hover=\"background: #8E3617; color: #FBF6EE;\" style-active=\"transform: scale(.97);\">Book a visit<\u002Fa>\n        <a href=\"#programs\" style=\"{{ heroCtaSecondary }}\" style-hover=\"border-color: #2B2320; color: #2B2320;\">See programs<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"ak-rise\" style=\"flex: 1 1 380px; min-width: min(100%, 300px); position: relative; animation-delay: .12s;\">\n      <div style=\"{{ heroFrameStyle }}\">\n        <sc-for list=\"{{ heroSlides }}\" as=\"s\">\n          <div role=\"img\" aria-label=\"{{ s.alt }}\" style=\"{{ s.style }}\"><\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <span class=\"ak-float\" style=\"position: absolute; top: 10px; right: 8px; display: grid; place-items: center; width: clamp(86px, 9vw, 118px); height: clamp(86px, 9vw, 118px); border-radius: 999px; background: #E8A33D; color: #2B2320; font-family: 'Gabarito', sans-serif; font-weight: 700; font-size: clamp(14px, 1.3vw, 17px); line-height: 1.15; text-align: center; box-shadow: 0 12px 28px rgba(43,35,32,.18);\">Ages<br>1.5 to 6<\u002Fspan>\n      <div style=\"display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-top: 18px;\">\n        <div style=\"display: flex; gap: 0;\">\n          <sc-for list=\"{{ heroDots }}\" as=\"d\">\n            <button type=\"button\" sc-camel-on-click=\"{{ d.pick }}\" aria-label=\"{{ d.label }}\" style=\"height: 44px; min-width: 44px; display: flex; align-items: center; justify-content: center; background: none; border: 0; padding: 0; cursor: pointer;\"><span style=\"{{ d.style }}\"><\u002Fspan><\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <span style=\"display: inline-flex; align-items: center; padding: 10px 18px; border-radius: 999px; background: #2B2320; color: #FBF6EE; font-family: 'Gabarito', sans-serif; font-weight: 600; font-size: 15px;\">11 centres<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1px; background: rgba(43,35,32,.14); border-top: 1px solid rgba(43,35,32,.14); border-bottom: 1px solid rgba(43,35,32,.14);\">\n    <div style=\"background: #FBF6EE; padding: clamp(18px, 4vw, 26px) 6px;\">\n      <p style=\"font-family: 'Gabarito', sans-serif; font-size: clamp(20px, 5vw, 40px); font-weight: 700; line-height: 1;\">1.5 to 6<\u002Fp>\n      <p style=\"font-size: clamp(12px, 3.4vw, 15px); line-height: 1.35; color: #5A4C45; margin-top: 8px;\">Years, from toddler to senior KG<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"background: #FBF6EE; padding: clamp(18px, 4vw, 26px) 6px clamp(18px, 4vw, 26px) clamp(10px, 3vw, 20px);\">\n      <p style=\"font-family: 'Gabarito', sans-serif; font-size: clamp(20px, 5vw, 40px); font-weight: 700; line-height: 1;\">11<\u002Fp>\n      <p style=\"font-size: clamp(12px, 3.4vw, 15px); line-height: 1.35; color: #5A4C45; margin-top: 8px;\">Centres across South India<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"background: #FBF6EE; padding: clamp(18px, 4vw, 26px) 6px clamp(18px, 4vw, 26px) clamp(10px, 3vw, 20px);\">\n      <p style=\"font-family: 'Gabarito', sans-serif; font-size: clamp(20px, 5vw, 40px); font-weight: 700; line-height: 1;\">4<\u002Fp>\n      <p style=\"font-size: clamp(12px, 3.4vw, 15px); line-height: 1.35; color: #5A4C45; margin-top: 8px;\">Programs, including teacher training<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"programs\" style=\"padding: clamp(56px, 9vw, 128px) 0 clamp(24px, 4vw, 48px);\">\n    <div class=\"ak-reveal\" style=\"display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 16px; margin-bottom: clamp(28px, 4vw, 48px);\">\n      <h2 style=\"font-size: clamp(32px, 4.4vw, 60px); line-height: 1.05; max-width: 18ch;\">Four ways to grow with us<span aria-hidden=\"true\" style=\"display: inline-flex; gap: 7px; margin-left: 14px; vertical-align: middle;\"><span style=\"width: 13px; height: 13px; border-radius: 999px; background: #B2461F; display: block;\"><\u002Fspan><span style=\"width: 13px; height: 13px; border-radius: 999px; background: #E8A33D; display: block;\"><\u002Fspan><span style=\"width: 13px; height: 13px; border-radius: 999px; background: #2B2320; display: block;\"><\u002Fspan><\u002Fspan><\u002Fh2>\n      <a href=\"#enquire\" style=\"display: flex; align-items: center; min-height: 44px; font-weight: 600; font-size: 16px;\">Ask about admissions<\u002Fa>\n    <\u002Fdiv>\n\n    <div class=\"ak-reveal\" style=\"display: flex; flex-direction: column; gap: 10px;\">\n      <sc-for list=\"{{ progRows }}\" as=\"r\">\n        <article style=\"{{ r.cardStyle }}\">\n          <button type=\"button\" sc-camel-on-click=\"{{ r.toggle }}\" aria-expanded=\"{{ r.open }}\" style=\"{{ r.headStyle }}\">\n            <span style=\"display: flex; flex-direction: column; align-items: flex-start; gap: 4px; text-align: left;\">\n              <span style=\"{{ r.ageStyle }}\">{{ r.age }}<\u002Fspan>\n              <span style=\"font-family: 'Gabarito', sans-serif; font-weight: 700; font-size: clamp(19px, 2.2vw, 28px); line-height: 1.15;\">{{ r.title }}<\u002Fspan>\n            <\u002Fspan>\n            <span aria-hidden=\"true\" style=\"{{ r.signStyle }}\">{{ r.sign }}<\u002Fspan>\n          <\u002Fbutton>\n          <div style=\"{{ r.panelStyle }}\">\n            <div style=\"overflow: hidden; min-height: 0;\">\n              <div style=\"display: flex; flex-wrap: wrap; gap: clamp(14px, 2vw, 28px); align-items: center; padding: 0 clamp(18px, 2.4vw, 28px) clamp(18px, 2.4vw, 28px);\">\n                <div role=\"img\" aria-label=\"Children at an Arka Kids classroom\" style=\"{{ r.imgStyle }}\"><\u002Fdiv>\n                <div style=\"flex: 1 1 260px; min-width: min(100%, 240px);\">\n                  <p style=\"{{ r.textStyle }}\">{{ r.blurb }}<\u002Fp>\n                  <a href=\"#enquire\" style=\"{{ r.linkStyle }}\">Enquire about {{ r.title }}<\u002Fa>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Farticle>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"about\" class=\"ak-reveal\" style=\"padding: clamp(48px, 8vw, 112px) 0; display: flex; flex-wrap: wrap; gap: clamp(28px, 4vw, 72px); align-items: center;\">\n    <div style=\"flex: 1 1 340px; min-width: min(100%, 280px); position: relative;\">\n      <span aria-hidden=\"true\" style=\"position: absolute; inset: auto 0 0 auto; width: 72%; height: 82%; border-radius: 28px; background: #E8A33D;\"><\u002Fspan>\n      <img src=\"https://arkakids.com/images/vision-aim/2.jpg\" alt=\"Children working with Montessori material at Arka Kids\" style=\"position: relative; width: 88%; aspect-ratio: 5 / 4; max-height: clamp(240px, 46vh, 460px); object-fit: cover; border-radius: 28px; display: block; margin-top: 26px;\">\n    <\u002Fdiv>\n    <div style=\"flex: 1.25 1 420px; min-width: min(100%, 300px);\">\n      <h2 style=\"font-size: clamp(30px, 3.6vw, 50px); line-height: 1.1; max-width: 20ch;\">Curiosity first, academics close behind<\u002Fh2>\n      <p style=\"margin-top: 22px; font-size: clamp(16px, 1.4vw, 19px); line-height: 1.65; color: #5A4C45; max-width: 54ch;\">Arka Kids is a unit of Ideal Play Abacus India. Our classrooms follow a Montessori-informed approach: children choose work, teachers observe and guide, and the day moves between focused activity and free play.<\u002Fp>\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 18px 24px; margin-top: 30px; padding-top: 26px; border-top: 1px solid rgba(43,35,32,.16);\">\n        <div>\n          <p style=\"font-family: 'Gabarito', sans-serif; font-weight: 700; font-size: 17px;\">Small groups<\u002Fp>\n          <p style=\"margin-top: 6px; font-size: 15px; line-height: 1.55; color: #5A4C45;\">Teachers know every child by name and pace.<\u002Fp>\n        <\u002Fdiv>\n        <div>\n          <p style=\"font-family: 'Gabarito', sans-serif; font-weight: 700; font-size: 17px;\">Daily observation<\u002Fp>\n          <p style=\"margin-top: 6px; font-size: 15px; line-height: 1.55; color: #5A4C45;\">Notes on what your child actually did, not a template.<\u002Fp>\n        <\u002Fdiv>\n        <div>\n          <p style=\"font-family: 'Gabarito', sans-serif; font-weight: 700; font-size: 17px;\">Trained educators<\u002Fp>\n          <p style=\"margin-top: 6px; font-size: 15px; line-height: 1.55; color: #5A4C45;\">Taught by our own Montessori training programme.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <a href=\"#enquire\" style=\"display: inline-flex; align-items: center; height: clamp(48px, 13vw, 52px); padding: 0 clamp(20px, 6vw, 28px); border-radius: 999px; border: 1.5px solid rgba(43,35,32,.25); color: #2B2320; font-weight: 600; margin-top: 30px; transition: transform .15s cubic-bezier(.2,0,0,1), border-color .15s ease;\" style-hover=\"border-color: #2B2320; color: #2B2320; transform: translateY(-2px);\" style-active=\"transform: scale(.97);\">Talk to us<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"padding: 0 0 clamp(56px, 9vw, 120px); display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: clamp(24px, 4vw, 56px);\">\n    <div style=\"min-width: 0;\">\n      <h2 style=\"font-size: clamp(26px, 2.6vw, 34px); line-height: 1.15;\">What we are working towards<\u002Fh2>\n      <div aria-hidden=\"true\" style=\"display: flex; gap: 8px; margin-top: 22px;\">\n        <span style=\"width: 34px; height: 34px; border-radius: 9px; background: #B2461F; display: block; transform: rotate(-6deg);\"><\u002Fspan>\n        <span style=\"width: 34px; height: 34px; border-radius: 9px; background: #E8A33D; display: block; transform: rotate(4deg);\"><\u002Fspan>\n        <span style=\"width: 34px; height: 34px; border-radius: 999px; background: #2B2320; display: block;\"><\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"ak-reveal\" style=\"min-width: 0; border-top: 2px solid #2B2320; padding-top: 20px;\">\n      <h3 style=\"font-size: 20px;\">Our vision<\u002Fh3>\n      <p style=\"margin-top: 12px; font-size: 17px; line-height: 1.6; color: #5A4C45;\">Confident, curious children who are cared for with genuine affection and given room to become the best they can be.<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"ak-reveal\" style=\"min-width: 0; border-top: 2px solid #2B2320; padding-top: 20px;\">\n      <h3 style=\"font-size: 20px;\">Our aim<\u002Fh3>\n      <p style=\"margin-top: 12px; font-size: 17px; line-height: 1.6; color: #5A4C45;\">A thorough grasp of English through talking, listening, reading and writing, built with hands-on Montessori material.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"why\" style=\"padding: 0 0 clamp(56px, 9vw, 120px);\">\n    <div class=\"ak-reveal\" style=\"display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 20px; margin-bottom: clamp(28px, 4vw, 52px);\">\n      <h2 style=\"font-size: clamp(32px, 4.4vw, 60px); line-height: 1.05; max-width: 20ch;\">Why parents choose Arka<\u002Fh2>\n      <span aria-hidden=\"true\" style=\"display: inline-flex; align-items: flex-end; gap: 6px; flex: 0 0 auto;\">\n        <span style=\"width: 34px; height: 17px; border-radius: 999px 999px 0 0; background: #E8A33D; display: block;\"><\u002Fspan>\n        <span style=\"width: 48px; height: 24px; border-radius: 999px 999px 0 0; background: #B2461F; display: block;\"><\u002Fspan>\n        <span style=\"width: 62px; height: 31px; border-radius: 999px 999px 0 0; background: #2B2320; display: block;\"><\u002Fspan>\n      <\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"{{ whyGridStyle }}\">\n      <div style=\"{{ whyItemStyle }}\">\n        <img src=\"https://arkakids.com/images/why-choose-us/1.jpg\" alt=\"A teacher working with a small group of children\" style=\"{{ whyImg1Style }}\" style-hover=\"transform: rotate(0deg);\">\n        <div style=\"min-width: 0;\">\n          <h3 style=\"{{ whyHeadStyle }}\">Teachers who stay close<\u002Fh3>\n          <p style=\"{{ whyTextStyle }}\">Trained educators, small groups, and daily observation notes that turn into real conversations with parents.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"{{ whyItemStyle }}\">\n        <img src=\"https://arkakids.com/images/banner/1.jpg\" alt=\"Children in a nursery classroom activity\" style=\"{{ whyImg2Style }}\" style-hover=\"transform: rotate(0deg);\">\n        <div style=\"min-width: 0;\">\n          <h3 style=\"{{ whyHeadStyle }}\">Play that teaches<\u002Fh3>\n          <p style=\"{{ whyTextStyle }}\">Learning centres, creative play areas and games sit alongside academics rather than after them.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"{{ whyItemStyle }}\">\n        <img src=\"https://arkakids.com/images/why-choose-us/2.jpg\" alt=\"An Arka Kids centre entrance\" style=\"{{ whyImg3Style }}\" style-hover=\"transform: rotate(0deg);\">\n        <div style=\"min-width: 0;\">\n          <h3 style=\"{{ whyHeadStyle }}\">A centre near you<\u002Fh3>\n          <p style=\"{{ whyTextStyle }}\">Eleven locations across Chennai and beyond, with daycare available at most centres.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n<\u002Fdiv>\n\n<sc-if value=\"{{ showGallery }}\" hint-placeholder-val=\"{{ true }}\">\n  <section style=\"padding: 0 0 clamp(56px, 9vw, 120px);\">\n    <div class=\"ak-reveal\" style=\"max-width: 1400px; margin: 0 auto; padding: 0 clamp(16px, 4vw, 56px); display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 16px;\">\n      <div style=\"display: flex; align-items: center; gap: 14px;\">\n        <h2 style=\"font-size: clamp(26px, 2.6vw, 34px); line-height: 1.15;\">A day at Arka<\u002Fh2>\n        <span aria-hidden=\"true\" class=\"ak-float\" style=\"display: grid; place-items: center; width: 54px; height: 54px; border-radius: 999px; background: #E8A33D; color: #2B2320; font-family: 'Gabarito', sans-serif; font-weight: 700; font-size: 13px; line-height: 1.1; text-align: center;\">Look<br>inside<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display: flex; gap: 8px;\">\n        <button type=\"button\" sc-camel-on-click=\"{{ galleryPrev }}\" aria-label=\"Previous photos\" style=\"width: clamp(44px, 11vw, 48px); height: clamp(44px, 11vw, 48px); border-radius: 999px; border: 1.5px solid rgba(43,35,32,.24); background: none; cursor: pointer; font-size: 18px; line-height: 1; transition: transform .15s cubic-bezier(.2,0,0,1), border-color .15s ease;\" style-hover=\"border-color: #2B2320;\" style-active=\"transform: scale(.95);\">‹<\u002Fbutton>\n        <button type=\"button\" sc-camel-on-click=\"{{ galleryNext }}\" aria-label=\"More photos\" style=\"width: clamp(44px, 11vw, 48px); height: clamp(44px, 11vw, 48px); border-radius: 999px; border: 1.5px solid rgba(43,35,32,.24); background: none; cursor: pointer; font-size: 18px; line-height: 1; transition: transform .15s cubic-bezier(.2,0,0,1), border-color .15s ease;\" style-hover=\"border-color: #2B2320;\" style-active=\"transform: scale(.95);\">›<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"noscroll\" ref=\"{{ galleryTrack }}\" style=\"display: flex; align-items: center; gap: clamp(14px, 1.8vw, 24px); overflow-x: auto; scroll-snap-type: x mandatory; padding: clamp(22px, 3vw, 34px) max(clamp(16px, 4vw, 56px), calc((100% - 1400px) / 2 + clamp(16px, 4vw, 56px))) 10px;\">\n        <figure class=\"g-pop\" style=\"flex: 0 0 auto; margin: 0; width: clamp(170px, 26vw, 320px); scroll-snap-align: center; animation-delay: .05s;\">\n          <img src=\"https://arkakids.com/images/banner/1.jpg\" alt=\"Children working with puzzles at a classroom table\" style=\"width: 100%; aspect-ratio: 3 / 4; object-fit: cover; border-radius: 22px; display: block; transform: rotate(-1.8deg); transition: transform .2s cubic-bezier(.2,0,0,1), box-shadow .2s ease;\" style-hover=\"transform: rotate(0deg) scale(1.02); box-shadow: 0 18px 36px rgba(43,35,32,.16);\">\n        <\u002Ffigure>\n        <figure class=\"g-pop\" style=\"flex: 0 0 auto; margin: 0; width: clamp(210px, 34vw, 430px); scroll-snap-align: center; animation-delay: .12s;\">\n          <img src=\"https://arkakids.com/images/banner/2.jpg\" alt=\"Children playing together in the classroom\" style=\"width: 100%; aspect-ratio: 16 / 10; object-fit: cover; border-radius: 22px; display: block; transform: rotate(1.4deg); transition: transform .2s cubic-bezier(.2,0,0,1), box-shadow .2s ease;\" style-hover=\"transform: rotate(0deg) scale(1.02); box-shadow: 0 18px 36px rgba(43,35,32,.16);\">\n        <\u002Ffigure>\n        <figure class=\"g-pop\" style=\"flex: 0 0 auto; margin: 0; width: clamp(155px, 22vw, 280px); scroll-snap-align: center; animation-delay: .19s;\">\n          <img src=\"https://arkakids.com/images/banner/4.jpg\" alt=\"Indoor play area\" style=\"width: 100%; aspect-ratio: 1 / 1; object-fit: cover; border-radius: 22px; display: block; transform: rotate(-1.2deg); transition: transform .2s cubic-bezier(.2,0,0,1), box-shadow .2s ease;\" style-hover=\"transform: rotate(0deg) scale(1.02); box-shadow: 0 18px 36px rgba(43,35,32,.16);\">\n        <\u002Ffigure>\n        <figure class=\"g-pop\" style=\"flex: 0 0 auto; margin: 0; width: clamp(195px, 30vw, 380px); scroll-snap-align: center; animation-delay: .26s;\">\n          <img src=\"https://arkakids.com/images/vision-aim/1.jpg\" alt=\"Children arriving at an Arka Kids classroom\" style=\"width: 100%; aspect-ratio: 4 / 3; object-fit: cover; border-radius: 22px; display: block; transform: rotate(1.8deg); transition: transform .2s cubic-bezier(.2,0,0,1), box-shadow .2s ease;\" style-hover=\"transform: rotate(0deg) scale(1.02); box-shadow: 0 18px 36px rgba(43,35,32,.16);\">\n        <\u002Ffigure>\n        <figure class=\"g-pop\" style=\"flex: 0 0 auto; margin: 0; width: clamp(165px, 24vw, 300px); scroll-snap-align: center; animation-delay: .33s;\">\n          <img src=\"https://arkakids.com/images/vision-aim/2.jpg\" alt=\"Children working with Montessori material\" style=\"width: 100%; aspect-ratio: 3 / 4; object-fit: cover; border-radius: 22px; display: block; transform: rotate(-1.4deg); transition: transform .2s cubic-bezier(.2,0,0,1), box-shadow .2s ease;\" style-hover=\"transform: rotate(0deg) scale(1.02); box-shadow: 0 18px 36px rgba(43,35,32,.16);\">\n        <\u002Ffigure>\n        <figure class=\"g-pop\" style=\"flex: 0 0 auto; margin: 0; width: clamp(195px, 30vw, 380px); scroll-snap-align: center; animation-delay: .4s;\">\n          <img src=\"https://arkakids.com/images/banner/3.jpg\" alt=\"Montessori training materials\" style=\"width: 100%; aspect-ratio: 4 / 3; object-fit: cover; border-radius: 22px; display: block; transform: rotate(1.2deg); transition: transform .2s cubic-bezier(.2,0,0,1), box-shadow .2s ease;\" style-hover=\"transform: rotate(0deg) scale(1.02); box-shadow: 0 18px 36px rgba(43,35,32,.16);\">\n        <\u002Ffigure>\n        <a href=\"#enquire\" class=\"g-pop\" style=\"flex: 0 0 auto; width: clamp(170px, 24vw, 260px); aspect-ratio: 1 / 1; scroll-snap-align: center; display: grid; place-items: center; text-align: center; padding: 24px; border-radius: 22px; background: #B2461F; color: #FBF6EE; font-family: 'Gabarito', sans-serif; font-weight: 700; font-size: clamp(18px, 1.8vw, 22px); line-height: 1.25; animation-delay: .47s; transition: transform .2s cubic-bezier(.2,0,0,1);\" style-hover=\"background: #8E3617; color: #FBF6EE; transform: translateY(-4px);\" style-active=\"transform: scale(.98);\">Come and see it in person<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fsection>\n<\u002Fsc-if>\n\n<section style=\"background: #F1E6D8;\">\n  <div style=\"max-width: 1400px; margin: 0 auto; padding: clamp(36px, 4.5vw, 64px) clamp(16px, 4vw, 56px);\">\n    <div class=\"ak-reveal\" style=\"display: flex; flex-wrap: wrap; gap: clamp(22px, 3vw, 44px); align-items: center;\">\n      <figure style=\"flex: 1.4 1 440px; min-width: min(100%, 300px); margin: 0;\">\n        <h2 style=\"font-size: clamp(22px, 2vw, 28px); line-height: 1.15;\">What families say<\u002Fh2>\n        <div style=\"display: flex; align-items: center; flex-wrap: wrap; gap: 10px 14px; margin: 14px 0 clamp(16px, 2vw, 22px);\">\n          <span aria-hidden=\"true\" style=\"display: inline-flex; gap: 3px; color: #9C6510; font-size: 19px; line-height: 1;\">★★★★★<\u002Fspan>\n          <span style=\"font-size: 15px; color: #3E3226;\">Rated by parents on Google Reviews<\u002Fspan>\n        <\u002Fdiv>\n        <blockquote style=\"margin: 0; position: relative; padding-left: .42em; font-family: 'Gabarito', sans-serif; font-size: clamp(23px, 2.4vw, 34px); line-height: 1.18; font-weight: 700; max-width: 22ch;\">\n          <span aria-hidden=\"true\" style=\"position: absolute; left: -0.06em; top: -0.18em; font-size: 1.9em; line-height: 1; color: #B2461F; opacity: .22;\">“<\u002Fspan>\n          She went from clinging at the gate to running in.\n        <\u002Fblockquote>\n        <figcaption style=\"margin-top: 20px; display: flex; align-items: center; gap: 14px;\">\n          <span aria-hidden=\"true\" style=\"width: 46px; height: 46px; border-radius: 999px; background: #B2461F; color: #FBF6EE; display: grid; place-items: center; font-family: 'Gabarito', sans-serif; font-weight: 700; font-size: 17px;\">DR<\u002Fspan>\n          <span style=\"font-size: 16px; line-height: 1.4; color: #2B2320;\">Divya Ramanathan<br><span style=\"{{ footerMetaLinkStyle }}\" style-hover=\"color: #2B2320;\">Parent, Adyar centre<\u002Fspan><\u002Fspan>\n        <\u002Ffigcaption>\n      <\u002Ffigure>\n      <div style=\"flex: 1 1 260px; min-width: min(100%, 240px);\">\n        <img src=\"https://arkakids.com/images/vision-aim/1.jpg\" alt=\"Children arriving at an Arka Kids classroom\" style=\"width: 100%; aspect-ratio: 5 / 4; max-height: clamp(220px, 42vh, 420px); object-fit: cover; border-radius: 24px; display: block; transform: rotate(1.4deg);\">\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"ak-reveal\" style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: clamp(12px, 1.4vw, 18px); margin-top: clamp(20px, 2.4vw, 30px);\">\n      <figure style=\"min-width: 0; margin: 0; background: #FBF6EE; border-radius: 20px; padding: clamp(18px, 2vw, 24px); display: flex; flex-direction: column; gap: 14px; transition: transform .15s cubic-bezier(.2,0,0,1), background .15s ease, border-color .15s ease, color .15s ease, box-shadow .15s ease;\" style-hover=\"transform: translateY(-4px); box-shadow: 0 14px 30px rgba(43,35,32,.10);\">\n        <blockquote style=\"margin: 0; font-size: 17px; line-height: 1.6; color: #2B2320;\">The teachers send a note about what he actually did that day, not a template.<\u002Fblockquote>\n        <figcaption style=\"display: flex; align-items: center; gap: 12px; margin-top: auto;\">\n          <span aria-hidden=\"true\" style=\"width: 40px; height: 40px; border-radius: 999px; background: #E8A33D; color: #2B2320; display: grid; place-items: center; font-family: 'Gabarito', sans-serif; font-weight: 700; font-size: 15px;\">KS<\u002Fspan>\n          <span style=\"font-size: 15px; line-height: 1.4; color: #2B2320;\">Karthik Subramanian<br><span style=\"{{ footerMetaLinkStyle }}\" style-hover=\"color: #2B2320;\">Parent, Chrompet centre<\u002Fspan><\u002Fspan>\n        <\u002Ffigcaption>\n      <\u002Ffigure>\n      <figure style=\"min-width: 0; margin: 0; background: #2B2320; color: #FBF6EE; border-radius: 20px; padding: clamp(18px, 2vw, 24px); display: flex; flex-direction: column; gap: 14px; transition: transform .15s cubic-bezier(.2,0,0,1), background .15s ease, border-color .15s ease, color .15s ease, box-shadow .15s ease;\" style-hover=\"transform: translateY(-4px); box-shadow: 0 14px 30px rgba(43,35,32,.18);\">\n        <blockquote style=\"margin: 0; font-size: 17px; line-height: 1.6;\">I finished the training while working weekends. The classroom practice is what got me hired.<\u002Fblockquote>\n        <figcaption style=\"display: flex; align-items: center; gap: 12px; margin-top: auto;\">\n          <span aria-hidden=\"true\" style=\"width: 40px; height: 40px; border-radius: 999px; background: #E8A33D; color: #2B2320; display: grid; place-items: center; font-family: 'Gabarito', sans-serif; font-weight: 700; font-size: 15px;\">MV<\u002Fspan>\n          <span style=\"font-size: 15px; line-height: 1.4;\">Meenakshi Vardhan<br><span style=\"color: #D8CEC2;\">Montessori training graduate<\u002Fspan><\u002Fspan>\n        <\u002Ffigcaption>\n      <\u002Ffigure>\n      <figure style=\"min-width: 0; margin: 0; background: #FBF6EE; border-radius: 20px; padding: clamp(18px, 2vw, 24px); display: flex; flex-direction: column; gap: 14px; transition: transform .15s cubic-bezier(.2,0,0,1), background .15s ease, border-color .15s ease, color .15s ease, box-shadow .15s ease;\" style-hover=\"transform: translateY(-4px); box-shadow: 0 14px 30px rgba(43,35,32,.10);\">\n        <blockquote style=\"margin: 0; font-size: 17px; line-height: 1.6; color: #2B2320;\">Daycare after school made the difference for us. He naps, eats and still gets outdoor time.<\u002Fblockquote>\n        <figcaption style=\"display: flex; align-items: center; gap: 12px; margin-top: auto;\">\n          <span aria-hidden=\"true\" style=\"width: 40px; height: 40px; border-radius: 999px; background: #B2461F; color: #FBF6EE; display: grid; place-items: center; font-family: 'Gabarito', sans-serif; font-weight: 700; font-size: 15px;\">AN<\u002Fspan>\n          <span style=\"font-size: 15px; line-height: 1.4; color: #2B2320;\">Anitha Nagarajan<br><span style=\"{{ footerMetaLinkStyle }}\" style-hover=\"color: #2B2320;\">Parent, Mylapore centre<\u002Fspan><\u002Fspan>\n        <\u002Ffigcaption>\n      <\u002Ffigure>\n    <\u002Fdiv>\n    <div style=\"margin-top: clamp(20px, 2.4vw, 30px);\">\n      <a href=\"https://www.google.com/search?q=Arka+Kids+International+School+reviews\" style=\"display: inline-flex; align-items: center; height: clamp(48px, 13vw, 50px); padding: 0 clamp(20px, 6vw, 28px); border-radius: 999px; border: 1.5px solid rgba(43,35,32,.28); color: #2B2320; font-weight: 600; font-size: 16px; transition: transform .15s cubic-bezier(.2,0,0,1), border-color .15s ease;\" style-hover=\"border-color: #2B2320; color: #2B2320; transform: translateY(-2px);\">Read more reviews<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<div style=\"max-width: 1400px; margin: 0 auto; padding: 0 clamp(16px, 4vw, 56px);\">\n  <section id=\"faq\" style=\"padding: clamp(56px, 9vw, 120px) 0; display: flex; flex-wrap: wrap; gap: clamp(24px, 4vw, 64px);\">\n    <div class=\"ak-reveal\" style=\"flex: 1 1 280px; min-width: min(100%, 260px);\">\n      <span aria-hidden=\"true\" style=\"display: block; width: 54px; height: 54px; border-radius: 999px; margin-bottom: 20px; background: conic-gradient(#B2461F 0 25%, #E8A33D 0 50%, #B2461F 0 75%, #E8A33D 0);\"><\u002Fspan>\n      <h2 style=\"font-size: clamp(30px, 3.4vw, 46px); line-height: 1.08;\">Questions parents ask<\u002Fh2>\n      <p style=\"margin-top: 18px; font-size: 17px; line-height: 1.6; color: #5A4C45; max-width: 32ch;\">Still unsure? Call <a href=\"tel:919940416989\" style=\"{{ faqPhoneStyle }}\">+91 99404 16989<\u002Fa> and we will walk you through it.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"flex: 2 1 440px; min-width: min(100%, 280px);\">\n      <sc-for list=\"{{ faqs }}\" as=\"item\" hint-placeholder-count=\"5\">\n        <div style=\"border-top: 1px solid rgba(43,35,32,.18);\">\n          <button type=\"button\" sc-camel-on-click=\"{{ item.toggle }}\" aria-expanded=\"{{ item.expanded }}\" style=\"width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 22px 0; background: none; border: 0; text-align: left; cursor: pointer; font-family: 'Gabarito', sans-serif; font-size: clamp(17px, 1.7vw, 21px); font-weight: 600;\">\n            {{ item.q }}\n            <span aria-hidden=\"true\" style=\"flex: 0 0 auto; width: 34px; height: 34px; border-radius: 999px; border: 1.5px solid rgba(43,35,32,.25); display: grid; place-items: center; font-size: 18px; line-height: 1;\">{{ item.sign }}<\u002Fspan>\n          <\u002Fbutton>\n          <div style=\"{{ item.panelStyle }}\">\n            <div style=\"overflow: hidden; min-height: 0;\">\n              <p style=\"padding-bottom: 22px; font-size: 17px; line-height: 1.65; color: #5A4C45; max-width: 62ch;\">{{ item.a }}<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n      <div style=\"border-top: 1px solid rgba(43,35,32,.18);\"><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n<\u002Fdiv>\n\n<div aria-hidden=\"true\" style=\"height: 26px; background-image: radial-gradient(circle at 13px 26px, #B2461F 13px, transparent 13.5px); background-size: 26px 26px; background-repeat: repeat-x;\"><\u002Fdiv>\n<section id=\"enquire\" style=\"background: #B2461F; color: #FBF6EE;\">\n  <div style=\"max-width: 1400px; margin: 0 auto; padding: clamp(48px, 7vw, 96px) clamp(16px, 4vw, 56px); display: flex; flex-wrap: wrap; gap: clamp(28px, 4vw, 64px);\">\n    <div class=\"ak-reveal\" style=\"flex: 1 1 320px; min-width: min(100%, 280px);\">\n      <span style=\"display: inline-block; padding: 8px 18px; transform: rotate(-2deg); border-radius: 999px; background: #E8A33D; color: #2B2320; font-family: 'Gabarito', sans-serif; font-weight: 700; font-size: 14px; margin-bottom: 22px;\">Visits are free<\u002Fspan>\n      <h2 style=\"font-size: clamp(32px, 4.2vw, 56px); line-height: 1.05; max-width: 14ch;\">Come and see a classroom<\u002Fh2>\n      <p style=\"margin-top: 20px; font-size: 18px; line-height: 1.6; color: #FBF6EE; max-width: 40ch;\">Tell us a little about your child or your training plans, and we will call you back.<\u002Fp>\n      <div style=\"margin-top: 32px; display: flex; flex-direction: column; gap: 10px; font-size: 18px;\">\n        <a href=\"tel:919940416989\" style=\"{{ contactPhoneStyle }}\">+91 99404 16989<\u002Fa>\n        <a href=\"mailto:contact@arkakids.com\" style=\"{{ contactMailStyle }}\">contact@arkakids.com<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"flex: 1.4 1 420px; min-width: min(100%, 280px);\">\n      <sc-if value=\"{{ sent }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"background: #FBF6EE; color: #2B2320; border-radius: 24px; padding: clamp(28px, 4vw, 48px);\">\n          <h3 style=\"font-size: 26px;\">Thank you<\u002Fh3>\n          <p style=\"margin-top: 12px; font-size: 17px; line-height: 1.6; color: #5A4C45;\">We have your details and will call you within one working day.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ notSent }}\" hint-placeholder-val=\"{{ true }}\">\n        <form sc-camel-on-submit=\"{{ submit }}\" style=\"background: #FBF6EE; color: #2B2320; border-radius: 24px; padding: clamp(24px, 3vw, 40px); display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 20px;\">\n          <div style=\"display: flex; flex-direction: column; gap: 8px;\">\n            <label for=\"ak-name\" style=\"font-size: 14px; font-weight: 600;\">Your name<\u002Flabel>\n            <input id=\"ak-name\" name=\"name\" type=\"text\" required=\"\" placeholder=\"Priya Raghavan\" style=\"height: 50px; padding: 0 16px; border-radius: 12px; border: 1.5px solid rgba(43,35,32,.28); background: #FFFFFF;\">\n          <\u002Fdiv>\n          <div style=\"display: flex; flex-direction: column; gap: 8px;\">\n            <label for=\"ak-phone\" style=\"font-size: 14px; font-weight: 600;\">Phone<\u002Flabel>\n            <input id=\"ak-phone\" name=\"phone\" type=\"tel\" required=\"\" placeholder=\"+91 98400 12345\" style=\"height: 50px; padding: 0 16px; border-radius: 12px; border: 1.5px solid rgba(43,35,32,.28); background: #FFFFFF;\">\n          <\u002Fdiv>\n          <div style=\"display: flex; flex-direction: column; gap: 10px; grid-column: 1 / -1;\">\n            <span id=\"ak-interest-label\" style=\"font-size: 14px; font-weight: 600;\">I am enquiring about<\u002Fspan>\n            <div role=\"group\" aria-labelledby=\"ak-interest-label\" style=\"display: flex; flex-wrap: wrap; gap: 8px;\">\n              <sc-for list=\"{{ interests }}\" as=\"opt\" hint-placeholder-count=\"3\">\n                <button type=\"button\" sc-camel-on-click=\"{{ opt.pick }}\" aria-pressed=\"{{ opt.active }}\" style=\"{{ opt.style }}\" style-hover=\"border-color: #2B2320;\" style-active=\"transform: scale(.97);\">{{ opt.label }}<\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <sc-if value=\"{{ isFranchise }}\" hint-placeholder-val=\"{{ false }}\">\n              <p style=\"font-size: 14px; line-height: 1.5; color: #5A4C45;\">Franchise enquiries go to the Ideal Play Abacus team. Mention your preferred city in the message.<\u002Fp>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n          <div style=\"display: flex; flex-direction: column; gap: 8px; grid-column: 1 / -1;\">\n            <label for=\"ak-msg\" style=\"font-size: 14px; font-weight: 600;\">Message<\u002Flabel>\n            <textarea id=\"ak-msg\" name=\"message\" rows=\"3\" placeholder=\"Child's age, preferred centre, or anything else\" style=\"padding: 14px 16px; border-radius: 12px; border: 1.5px solid rgba(43,35,32,.28); background: #FFFFFF; resize: vertical;\"><\u002Ftextarea>\n            <p style=\"font-size: 13px; color: #6B5C54;\">We reply within one working day.<\u002Fp>\n          <\u002Fdiv>\n          <button type=\"submit\" style=\"grid-column: 1 / -1; justify-self: start; height: 52px; padding: 0 32px; border-radius: 999px; border: 0; background: #2B2320; color: #FBF6EE; font-family: 'Gabarito', sans-serif; font-weight: 600; font-size: 16px; cursor: pointer;\" style-hover=\"background: #453A35;\" style-active=\"transform: translateY(1px);\">Send enquiry<\u002Fbutton>\n        <\u002Fform>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<sc-if value=\"{{ showLocations }}\" hint-placeholder-val=\"{{ true }}\">\n  <section style=\"max-width: 1400px; margin: 0 auto; padding: clamp(48px, 7vw, 96px) clamp(16px, 4vw, 56px) 0;\">\n    <div class=\"ak-reveal\" style=\"display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 18px;\">\n      <div>\n        <h2 style=\"font-size: clamp(26px, 2.6vw, 34px); line-height: 1.15;\">Find your nearest centre<\u002Fh2>\n        <div role=\"tablist\" aria-label=\"Centre locations\" style=\"display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px;\">\n          <sc-for list=\"{{ areaTabs }}\" as=\"tab\" hint-placeholder-count=\"3\">\n            <button type=\"button\" role=\"tab\" aria-selected=\"{{ tab.active }}\" sc-camel-on-click=\"{{ tab.pick }}\" style=\"{{ tab.style }}\" style-active=\"transform: scale(.97);\">{{ tab.label }}<\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display: flex; gap: 8px;\">\n        <button type=\"button\" sc-camel-on-click=\"{{ scrollPrev }}\" aria-label=\"Previous centres\" style=\"width: clamp(44px, 11vw, 48px); height: clamp(44px, 11vw, 48px); border-radius: 999px; border: 1.5px solid rgba(43,35,32,.24); background: none; cursor: pointer; font-size: 18px; line-height: 1; transition: transform .15s cubic-bezier(.2,0,0,1), border-color .15s ease;\" style-hover=\"border-color: #2B2320 > {\n      const narrow = window.innerWidth < 900;\n      if (narrow !== this.state.narrow) this.setState({ narrow, navOpen: false, menuOpen: false });\n    };\n    this._down = (e) => {\n      const t = e.target;\n      if (!t || !t.closest || !t.closest('[data-ak-nav]')) this.setState({ menuOpen: false, navOpen: false });\n    };\n    this._esc = (e) => { if (e.key === 'Escape') this.setState({ menuOpen: false, navOpen: false }); };\n    this.setState({ narrow: window.innerWidth < 900 });\n    if (!window.matchMedia(\"(prefers-reduced-motion: reduce)\").matches) {\n      this._hero = setInterval(() => this.setState(s => ({ hero: ((s.hero || 0) + 1) % 3 })), 3600);\n    }\n    window.addEventListener('resize', this._sync);\n    document.addEventListener('pointerdown', this._down);\n    document.addEventListener('keydown', this._esc);\n  }\n\n  componentWillUnmount() {\n    clearInterval(this._hero);\n    window.removeEventListener('resize', this._sync);\n    document.removeEventListener('pointerdown', this._down);\n    document.removeEventListener('keydown', this._esc);\n  }\n\n  faqData = [\n    { q: \"What age can my child join?\", a: \"Children can start from 1.5 years in the toddler program. Nursery begins around 2.5, and Junior KG around 3.5.\" },\n    { q: \"Do you run Montessori training courses?\", a: \"Yes. Our certified teachers' training covers international-standard modules, child psychology and supervised classroom practice, with online and in-person options.\" },\n    { q: \"Is there daycare after school hours?\", a: \"Most centres offer structured daycare with rest, snacks and quiet activity. Tell us your hours and we will confirm for your centre.\" },\n    { q: \"How do admissions work?\", a: \"Send an enquiry or call us, visit the centre for a short observation, then complete the form. Admissions stay open through the year where seats allow.\" },\n    { q: \"What does a typical day look like?\", a: \"Circle time, a long uninterrupted work period wi
